services:
  - type: web
    name: scolarix-api
    runtime: node
    rootDir: backend-nestjs
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: scolarix-447f2
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-adminsdk.json
      - key: NODE_VERSION
        value: 20

  # École Manager (Laravel) : image Docker construite depuis school-management-api.
  # Déployé uniquement quand les tests GitHub Actions de la branche master sont verts.
  - type: web
    name: ecole-manager
    runtime: docker
    rootDir: school-management-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: master
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: École Manager
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      # Base PostgreSQL hébergée chez Neon (offre gratuite) : adresse de connexion
      # directe (sans « pooler »), avec ?sslmode=require, à coller dans Render.
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: PAYDUNYA_MODE
        value: test
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: PAYDUNYA_REDISTRIBUTION_ENABLED
        value: "false"
      - key: PAYDUNYA_RECIPIENT_PHONE
        sync: false
      - key: PAYDUNYA_RECIPIENT_WITHDRAW_MODE
        value: moov-togo
